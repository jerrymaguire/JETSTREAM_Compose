global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: agentcompose

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    follow_redirects: true
    bearer_token_file: /tmp/prometheus_gateway_token
    static_configs:
      - targets: ["gateway:4000"]
        labels:
          layer: gateway
          service: gateway

  - job_name: agent
    metrics_path: /metrics
    static_configs:
      - targets: ["agent:8080"]
        labels:
          layer: application
          service: agent

  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          layer: monitoring
          service: prometheus
