model_list:
  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_base: os.environ/DEEPSEEK_API_BASE
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 80
      max_retries: 0
    model_info:
      id: deepseek-flash-primary

  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_base: os.environ/DEEPSEEK_API_BASE
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 80
      max_retries: 0
    model_info:
      id: deepseek-flash-standby

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 0
  max_fallbacks: 1
  allowed_fails: 1
  cooldown_time: 30
  timeout: 80
  fallbacks:
    - deepseek-flash:
        - deepseek-flash

litellm_settings:
  callbacks: ["prometheus"]
  drop_params: true
  set_verbose: false
  request_timeout: 80

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
